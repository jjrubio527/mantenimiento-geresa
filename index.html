<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Mantenimiento - GERESA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>UNIDAD FUNCIONAL DE MANTENIMIENTO DE INFRAESTRUCTURA Y EQUIPAMIENTO EN SALUD</h2>
        
        <form id="mantenimientoForm">
            <!-- BUSCADOR EE.SS. -->
            <div class="form-group">
                <label for="eessInput">Establecimiento de Salud (EE.SS.) *</label>
                <input type="text" id="eessInput" placeholder="Escriba para buscar su centro de salud..." autocomplete="off" required>
                <div id="searchResults" class="results-list"></div>
            </div>

            <!-- SISGEDO -->
            <div class="form-group">
                <label for="sisgedo">N° de Expediente SISGEDO / Oficio *</label>
                <input type="text" id="sisgedo" placeholder="Ej: EXP-2024-1234 o OFICIO N° 456-2024" required>
            </div>

            <!-- CATEGORÍA -->
            <div class="form-group">
                <label for="categoria">Categoría del Mantenimiento *</label>
                <select id="categoria" required>
                    <option value="">-- Seleccionar categoría --</option>
                    <option value="Infraestructura">Infraestructura</option>
                    <option value="Equipamiento Médico">Equipamiento Médico</option>
                    <option value="Vehículo/Ambulancia">Vehículo/Ambulancia</option>
                    <option value="Sistemas/Cómputo">Sistemas/Cómputo</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>

            <!-- EQUIPO -->
            <div class="form-group">
                <label for="equipo">Nombre del Equipo o Área Afectada *</label>
                <input type="text" id="equipo" placeholder="Ej: Ecógrafo, Rayos X, Unidad Dental, Techo de Tópico, etc." required>
            </div>

            <!-- MARCA -->
            <div class="form-group">
                <label for="marca">Marca</label>
                <input type="text" id="marca" placeholder="Ej: Mindray">
            </div>

            <!-- MODELO -->
            <div class="form-group">
                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" placeholder="Ej: DC-N3">
            </div>

            <!-- CÓDIGO PATRIMONIAL -->
            <div class="form-group">
                <label for="codigo">Código Patrimonial / Serie</label>
                <input type="text" id="codigo" placeholder="Ej: 742255880012">
            </div>

            <!-- CONDICIÓN -->
            <div class="form-group">
                <label for="condicion">Condición Actual del Bien *</label>
                <select id="condicion" required>
                    <option value="">-- Seleccionar condición --</option>
                    <option value="Inoperativo">Inoperativo (No funciona)</option>
                    <option value="Operativo con Falla">Operativo con Falla (Funciona a medias)</option>
                    <option value="Mantenimiento Preventivo">Mantenimiento Preventivo Requerido</option>
                </select>
            </div>

            <!-- DESCRIPCIÓN -->
            <div class="form-group">
                <label for="descripcion">Descripción Detallada del Problema *</label>
                <textarea id="descripcion" rows="4" placeholder="Escriba aquí los detalles del fallo..." required></textarea>
            </div>

            <!-- PRIORIDAD -->
            <div class="form-group">
                <label for="prioridad">Prioridad Sugerida *</label>
                <select id="prioridad" required>
                    <option value="Alta">Alta (Atención inmediata)</option>
                    <option value="Media" selected>Media (Atención normal)</option>
                    <option value="Baja">Baja (Atención programada)</option>
                </select>
            </div>

            <!-- TELÉFONO -->
            <div class="form-group">
                <label for="telefono">Teléfono / WhatsApp de Contacto para Coordinaciones *</label>
                <input type="tel" id="telefono" placeholder="Ej: 987654321 - Nombre del responsable del reporte" required>
            </div>

            <!-- BOTONES DE FOTO (CÁMARA / GALERÍA) -->
            <div class="form-group">
                <label>Adjuntar Foto o Evidencia (Opcional)</label>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <button type="button" onclick="document.getElementById('inputCamara').click();" style="flex: 1; background: #0284c7; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;">
                        📸 Tomar Foto
                    </button>
                    <button type="button" onclick="document.getElementById('inputGaleria').click();" style="flex: 1; background: #475569; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;">
                        🖼️ Elegir Galería
                    </button>
                </div>
                <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display: none;">
                <input type="file" id="inputGaleria" accept="image/*" style="display: none;">
                <small id="nombreFotoSeleccionada" style="color: #16a34a; display: block; margin-top: 8px; font-weight: bold;"></small>
            </div>

            <!-- BOTÓN ENVIAR -->
            <button type="submit">REGISTRAR Y ENVIAR REPORTE</button>
        </form>
    </div>

    <!-- OVERLAYS (CARGA Y ÉXITO) -->
    <div id="loadingOverlay" class="overlay">
        <div class="modal-content">
            <div class="spinner"></div>
            <p>Enviando reporte, por favor espere...</p>
        </div>
    </div>

    <div id="modalExito" class="overlay">
        <div class="modal-content">
            <h3>¡Reporte Registrado con Éxito!</h3>
            <p>Su solicitud ha sido registrada correctamente en la base de datos de la UFMIES.</p>
            <button id="btnNuevoRegistro">REGISTRAR OTRO REPORTE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
